# BiMTokenizer Mamba1 + RSLQ-no-scale inference configuration
# 16 kHz / 2200 bps when all 16 codebooks are enabled.

sample_rate: &sample_rate 16000

inference:
  # Select 1-16 codebooks at inference time.  The architecture still has 16.
  n_codebooks: 16

model:
  sample_rate: *sample_rate
  encoder_downsample_rate: 1280
  decoder_upsample_rate: 1280
  quantizer_type: "rslq_noscale"

  feature_extractor:
    chunk_length: 30
    feature_size: 80
    sampling_rate: *sample_rate
    hop_length: 160
    n_fft: 400
    n_samples: 480000
    nb_max_frames: 3000
    padding_side: "right"
    padding_value: 0.0
    return_attention_mask: true

  encoder: &mamba_block
    num_mel_bins: 80
    stride_size: 2
    kernel_size: 3
    d_model: 768
    mamba_version: 1
    d_state: 16
    d_conv: 4
    expand: 2
    dt_rank: "auto"
    d_intermediate: 1536
    bias: true
    fused_add_norm: true
    rms_norm: true
    norm_epsilon: 0.00001
    initializer_cfg: null
    residual_in_fp32: true
    n_mamba: 8
    bidirectional: true
    bimamba_type: v3

  decoder:
    <<: *mamba_block

  downsample:
    in_dim: 768
    latent_dim: 512
    stack_factor: 4
    hidden_dim: 512
    proj_type: "linear"
    num_heads: 8

  quantizer:
    num_codebooks: 16
    embedding_dim: 512
    codebook_size: 2048
    codebook_path: "bimtokenizer/modules/quantizer/cache/leech_subset_2048.npy"
    leech_type: "null"

  upsample:
    latent_dim: 512
    out_dim: 768
    stack_factor: 4
    hidden_dim: 512
    proj_type: "linear"
    num_heads: 8

  vocos:
    input_channels: 80
    dim: 512
    intermediate_dim: 4096
    num_layers: 12
    n_fft: 640
    hop_size: 160
    padding: "same"
